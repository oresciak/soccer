<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Manager</title>
    <style>
      :root {
        --panel: rgba(9, 17, 28, 0.86);
        --panel-border: rgba(255,255,255,0.12);
        --accent: #2dd4bf;
        --accent-2: #facc15;
        --text: #ecfdf5;
        --muted: #bfd3d1;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      body {
        position: relative;
        background-image: url('background.jpg');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-attachment: fixed;
        color: var(--text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-user-drag: none;
        user-drag: none;
      }

      html, body, * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none;
      }

      .app {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .top-date {
        position: absolute;
        top: 16px;
        left: 18px;
        z-index: 2;
        display: flex;
        align-items: baseline;
        gap: 8px;
        color: #f4f4f4;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        background: transparent;
        border: none;
        outline: none;
        box-shadow: none;
      }

      .top-date .day-number {
        font-size: clamp(2rem, 3vw, 3.2rem);
        line-height: 1;
      }

      .top-date .time {
        font-size: clamp(0.7rem, 1vw, 1rem);
        opacity: 0.92;
        line-height: 1;
      }

      .screen {
        width: min(1000px, 92vw);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        padding: 28px 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }

      .title {
        text-align: center;
        font-size: clamp(2rem, 3vw, 3rem);
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: 0.04em;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin-bottom: 20px;
        font-size: 1rem;
      }

      .button-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        width: 100%;
        margin: 0 auto 20px;
      }

      button {
        appearance: none;
        border: none;
        cursor: pointer;
        border-radius: 12px;
        padding: 12px 18px;
        min-width: 180px;
        font-size: 1rem;
        font-weight: 700;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), #14b8a6);
        color: #062b2a;
      }

      .secondary {
        background: rgba(255,255,255,0.08);
        color: var(--text);
        border: 1px solid var(--panel-border);
      }

      .save-status {
        text-align: center;
        color: var(--accent-2);
        min-height: 24px;
        font-weight: 600;
        margin-bottom: 18px;
      }

      .club-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .club-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 14px;
        cursor: pointer;
      }

      .club-card:hover {
        border-color: rgba(45,212,191,0.8);
      }

      .club-card h3 {
        margin: 0 0 8px;
        font-size: 1.15rem;
      }

      .club-meta {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top-date" id="topDate">
        <span class="day-number" id="dateDay">1</span>
        <span class="time" id="dateTime">12:00</span>
      </div>

      <div class="screen" id="gameScreen">
        <div class="title">Football Manager</div>
        <div class="subtitle">New save / database placeholder / club selection</div>

        <div class="button-row">
          <button class="primary" id="startSaveBtn">Start save</button>
          <button class="secondary" id="resetBtn">Reset data</button>
        </div>

        <div class="save-status" id="saveStatus">Waiting to start...</div>

        <div id="clubSelection" class="club-list hidden"></div>
      </div>
    </div>

    <script src="data/countries.js"></script>
    <script src="data/leagues.js"></script>
    <script src="data/clubs.js"></script>
    <script src="data/players.js"></script>

    <script>
      let gameState = {
        year: 2027,
        month: 7,
        day: 1,
        hour: 12,
        started: false,
        clubId: null,
        saveName: 'save_game_1'
      };

      const saveStatus = document.getElementById('saveStatus');
      const startSaveBtn = document.getElementById('startSaveBtn');
      const resetBtn = document.getElementById('resetBtn');
      const clubSelection = document.getElementById('clubSelection');
      const dateDay = document.getElementById('dateDay');
      const dateTime = document.getElementById('dateTime');

      function updateDateHeader() {
        dateDay.textContent = String(gameState.day);
        dateTime.textContent = `${String(gameState.hour).padStart(2, '0')}:00`;
      }

      function getDatabase() {
        return window.gameDatabase || {
          countries: [],
          leagues: [],
          clubs: [],
          players: []
        };
      }

      function createSave() {
        const db = getDatabase();
        const save = {
          meta: {
            saveName: gameState.saveName,
            startedAt: new Date(Date.UTC(gameState.year, gameState.month - 1, gameState.day, gameState.hour)).toISOString(),
            version: '0.1.0'
          },
          date: {
            year: gameState.year,
            month: gameState.month,
            day: gameState.day,
            hour: gameState.hour
          },
          selectedClubId: gameState.clubId,
          database: {
            countries: db.countries,
            leagues: db.leagues,
            clubs: db.clubs,
            players: db.players
          }
        };

        localStorage.setItem(gameState.saveName, JSON.stringify(save));
        return save;
      }

      function renderClubSelection() {
        const db = getDatabase();
        clubSelection.innerHTML = '';

        db.clubs.forEach((club) => {
          const card = document.createElement('div');
          card.className = 'club-card';
          card.innerHTML = `
            <h3>${club.name}</h3>
            <div class="club-meta">
              <div>League: ${db.leagues.find(l => l.id === club.leagueId)?.name || 'Missing league'}</div>
              <div>Country: ${db.countries.find(c => c.id === club.countryId)?.name || 'Missing country'}</div>
              <div>Prestige: ${club.prestige}</div>
              <div>Budget: €${(club.budget / 1000000).toFixed(1)}M</div>
              <div>Players: ${club.squadSize || 22}</div>
            </div>
          `;

          card.addEventListener('click', () => {
            gameState.clubId = club.id;
            saveStatus.textContent = `Selected club: ${club.name} | save in progress...`;
            const save = createSave();
            console.log('Save created:', save);
            clubSelection.classList.add('hidden');
            startSaveBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
            document.querySelector('.screen').style.display = 'none';
            updateDateHeader();
          });

          clubSelection.appendChild(card);
        });
      }

      function startSaveProcedure() {
        gameState.started = true;
        saveStatus.textContent = 'Creating game save...';
        clubSelection.classList.remove('hidden');
        renderClubSelection();
        updateDateHeader();
      }

      function resetGameData() {
        localStorage.removeItem(gameState.saveName);
        gameState.clubId = null;
        gameState.started = false;
        clubSelection.classList.add('hidden');
        saveStatus.textContent = 'Data reset. Waiting to start...';
        startSaveBtn.textContent = 'Start save';
        startSaveBtn.classList.remove('hidden');
        resetBtn.classList.remove('hidden');
        document.querySelector('.screen').style.display = 'block';
      }

      updateDateHeader();

      startSaveBtn.addEventListener('click', startSaveProcedure);
      resetBtn.addEventListener('click', resetGameData);

      document.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });

      document.addEventListener('selectstart', function (event) {
        event.preventDefault();
      });

      document.addEventListener('dragstart', function (event) {
        event.preventDefault();
      });
    </script>
  </body>
</html>
