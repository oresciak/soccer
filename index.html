<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Manager</title>
    <style>
      :root {
        --panel: rgba(9, 17, 28, 0.86);
        --panel-border: rgba(255,255,255,0.12);
        --accent: #2dd4bf;
        --accent-2: #facc15;
        --text: #ecfdf5;
        --muted: #bfd3d1;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      body {
        position: relative;
        background-image: url('background.jpg');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-attachment: fixed;
        color: var(--text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-user-drag: none;
      }

      html, body, * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none;
      }

      .app {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .top-date {
        position: absolute;
        top: 16px;
        left: 18px;
        z-index: 2;
        display: flex;
        align-items: baseline;
        gap: 8px;
        color: #f4f4f4;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        background: transparent;
        border: none;
        outline: none;
        box-shadow: none;
      }

      .top-date .day-number {
        font-size: clamp(2rem, 3vw, 3.2rem);
        line-height: 1;
      }

      .top-date .time {
        font-size: clamp(0.7rem, 1vw, 1rem);
        opacity: 0.92;
        line-height: 1;
      }

      .screen {
        width: 500px;
        max-width: 92vw;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }

      .screen.post-menu-active {
        width: min(1220px, 94vw);
        margin: 0 auto;
      }

      .selection-title {
        display: none;
      }

      .fifa-panel {
        width: 100%;
        background: transparent;
        border: none;
        border-radius: 0;
        overflow: hidden;
      }

      .fifa-section {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        position: relative;
      }

      .country-section {
        height: 92px;
        background: #1d1f22;
      }

      .club-section {
        height: 360px;
        background: #b777d6;
        padding: 12px 0;
      }

      .league-section {
        height: 90px;
        background: #2f3034;
      }

      .section-label {
        display: none;
      }

      .section-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 0 12px;
        box-sizing: border-box;
      }

      .arrow-btn {
        width: 44px;
        height: 44px;
        min-width: 44px;
        border: none;
        border-radius: 0;
        background: transparent;
        color: #fff;
        font-size: 1.9rem;
        cursor: pointer;
        flex-shrink: 0;
        line-height: 1;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .value-box {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        text-align: center;
        min-width: 0;
        padding-top: 20px;
      }

      .country-text {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0f0f0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        white-space: nowrap;
        line-height: 1.2;
        margin-top: 10px;
      }

      .club-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 310px;
        padding-top: 10px;
      }

      .club-logo {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: #f6d300;
        color: #111;
        border: 8px solid #000;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 3.4rem;
        font-weight: 900;
        font-family: Arial Black, Arial, sans-serif;
        line-height: 1;
        position: relative;
        box-shadow: inset 0 0 0 8px rgba(0,0,0,0.08);
        overflow: hidden;
        margin-top: 8px;
      }

      .club-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .club-logo::after {
        content: "";
        position: absolute;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 6px solid rgba(0,0,0,0.9);
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.15;
      }

      .club-name {
        margin-top: 175px;
        font-size: 1.7rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        line-height: 1.1;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .club-stars {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        margin-top: 8px;
        min-height: 24px;
        height: 24px;
      }

      .star {
        color: #ffffff;
        font-size: 1.3rem;
      }

      .club-stats {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-top: 12px;
        min-height: 58px;
      }

      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 56px;
      }

      .stat-label {
        font-size: 0.66rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.82);
        margin-bottom: 2px;
      }

      .stat-value {
        font-size: 1.5rem;
        font-weight: 800;
        color: #fff;
        line-height: 1;
      }

      .league-text {
        font-size: 1.15rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #f5f5f5;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        white-space: nowrap;
        line-height: 1.2;
        margin-top: 14px;
      }

      .selection-row,
      .selector-arrow,
      .selector-box,
      .selector-label,
      .selector-value {
        display: none !important;
      }

      .selection-actions {
        display: flex;
        justify-content: center;
        margin-top: 0px;
        width: 100%;
        padding: 0px;
        box-sizing: border-box;
      }

      .select-button {
        appearance: none;
        border: none;
        border-radius: 0;
        background: linear-gradient(135deg, #b777d6, #9e62c9);
        color: #ffffff;
        cursor: pointer;
        padding: 0;
        font-weight: 800;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-width: 0;
        width: calc(100%);
        height: 80px;
        font-size: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .post-select-menu {
        width: 100%;
        margin-top: 18px;
      }

      .post-select-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 12px;
        width: 100%;
        height: 360px;
      }

      .post-select-choice {
        min-width: 0;
        min-height: 0;
        background: rgba(15, 17, 22, 0.98);
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 12px 8px 10px;
        cursor: pointer;
      }

      .post-select-choice.is-active {
        background: #b777d6;
      }

      .post-select-choice-main {
        width: 100%;
        text-align: center;
        font-size: 1.50rem;
        font-weight: 900;
        line-height: 1.1;
        margin-top: 4px;
      }

      .post-select-choice-sub {
        width: 100%;
        text-align: center;
        font-size: 1.10rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        opacity: 0.85;
        margin-top: 70px;
      }

      .post-select-option-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        width: 100%;
        margin-top: 62px;
      }

      .post-select-option-arrow {
        min-width: 0;
        padding: 0;
        background: transparent;
        color: #ffffff;
        font-size: 1.8rem;
        line-height: 1;
        font-weight: 900;
      }

      .post-select-option-controls .post-select-choice-sub {
        width: auto;
        margin-top: 0;
      }

      .post-select-choice.select-choice {
        min-width: 0;
      }

      .post-select-choice.select-choice .post-select-choice-main {
        margin-top: auto;
        margin-bottom: auto;
        font-size: 1.90rem;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      .save-name-screen {
        width: 100%;
        margin: 0 auto;
        background: #0f1116;
        color: #ffffff;
        padding: 42px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .save-name-title {
        margin: 0 0 22px;
        font-size: 2rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .save-name-content {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 28px;
      }

      .save-list,
      .save-name-editor {
        background: #191c24;
        min-height: 540px;
        padding: 28px;
      }

      .save-list-heading {
        margin: 0 0 14px;
        color: #d6a7ea;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .save-slot {
        width: 100%;
        min-height: 70px;
        margin-bottom: 10px;
        padding: 12px 14px;
        background: #252934;
        color: #ffffff;
        text-align: left;
        font-size: 1rem;
        font-weight: 800;
      }

      .save-slot.is-active {
        background: #b777d6;
        color: #120d16;
      }

      .save-name-input {
        width: 100%;
        height: 58px;
        border: none;
        outline: none;
        padding: 0 16px;
        background: #0f1116;
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .screen-keyboard {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 6px;
        margin-top: 18px;
      }

      .screen-key {
        min-width: 0;
        height: 42px;
        padding: 0;
        background: #252934;
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 800;
      }

      .screen-key:hover,
      .save-name-confirm:hover {
        background: #b777d6;
        color: #120d16;
      }

      .screen-key.is-active,
      .save-name-back.is-active,
      .save-name-confirm.is-active {
        background: #b777d6;
        color: #120d16;
      }

      .screen-key.caps-lock-active {
        background: #b777d6;
        color: #120d16;
      }

      .screen-key.wide {
        grid-column: span 2;
      }

      .screen-key.extra-wide {
        grid-column: span 5;
      }

      .save-name-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      .save-name-confirm,
      .save-name-back {
        flex: 1;
        height: 54px;
        padding: 0;
        background: #b777d6;
        color: #120d16;
        font-size: 1rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .save-name-back {
        background: #252934;
        color: #ffffff;
      }

      .button-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        width: 100%;
        margin: 0 auto 20px;
      }

      .main-menu {
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 18px;
        width: min(1100px, 90vw);
        margin: 0 auto;
      }

      .career-launcher {
        flex: 1.35;
        min-height: 600px;
        background: rgba(15, 17, 22, 0.98);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        position: relative;
        color: #fff;
        text-transform: uppercase;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        letter-spacing: 0.1em;
        cursor: pointer;
        padding: 22px 24px 20px;
      }

      .career-launcher.is-active,
      .menu-panel.is-active {
        background: #b777d6;
      }

      .career-launcher:not(.is-active),
      .menu-panel:not(.is-active) {
        background: rgba(15, 17, 22, 0.98);
      }

      .career-image-slot {
        width: 100%;
        height: 200px;
        display: block;
        opacity: 0;
        pointer-events: none;
        margin-bottom: 28px;
      }

      .career-launcher .main-button-title {
        font-size: clamp(2rem, 2.4vw, 3rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        text-align: left;
        line-height: 1.1;
      }

      .menu-side {
        flex: 0.9;
        min-height: 600px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .menu-panel {
        height: calc((600px - 32px) / 3);
        background: rgba(15, 17, 22, 0.98);
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        position: relative;
        padding: 18px 20px;
      }

      .menu-panel-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      .menu-thumb {
        width: 100%;
        height: 104px;
        opacity: 0;
        pointer-events: none;
        display: block;
      }

      .menu-panel-label {
        font-size: 1.2rem;
        font-weight: 800;
        line-height: 1;
        text-align: left;
      }

      button {
        appearance: none;
        border: none;
        cursor: pointer;
        min-width: 180px;
        font-size: 1rem;
        font-weight: 700;
      }

      .start {
        background: linear-gradient(135deg, #b777d6, #9e62c9);
        color: #ffffff;
      }

      .secondary {
        background: rgba(255,255,255,0.08);
        color: var(--text);
        border: 1px solid var(--panel-border);
      }

      .save-status {
        text-align: center;
        color: var(--accent-2);
        min-height: 24px;
        font-weight: 600;
        margin-bottom: 18px;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top-date" id="topDate">
        <span class="day-number" id="dateDay">1</span>
        <span class="time" id="dateTime">12:00</span>
      </div>

      <div class="screen hidden" id="gameScreen">
        <div class="fifa-panel">
          <div class="fifa-section country-section">
            <div class="section-label">Country</div>
            <div class="section-content">
              <button class="arrow-btn" type="button" data-panel="country" data-dir="-1">◀</button>
              <div class="value-box">
                <div class="country-text" id="countryValue">Poland</div>
              </div>
              <button class="arrow-btn" type="button" data-panel="country" data-dir="1">▶</button>
            </div>
          </div>

          <div class="fifa-section club-section">
            <div class="section-content">
              <button class="arrow-btn" type="button" data-panel="club" data-dir="-1">◀</button>
              <div class="value-box">
                <div class="club-inner">
                  <div class="club-logo" id="clubLogo"></div>
                  <div class="club-name" id="clubName">Legia Warsaw</div>
                  <div class="club-stars" id="clubStars">
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                  </div>
                  <div class="club-stats" id="clubStats">
                    <div class="stat">
                      <div class="stat-label">ATT</div>
                      <div class="stat-value" id="statAtt">86</div>
                    </div>
                    <div class="stat">
                      <div class="stat-label">MID</div>
                      <div class="stat-value" id="statMid">82</div>
                    </div>
                    <div class="stat">
                      <div class="stat-label">DEF</div>
                      <div class="stat-value" id="statDef">82</div>
                    </div>
                  </div>
                </div>
              </div>
              <button class="arrow-btn" type="button" data-panel="club" data-dir="1">▶</button>
            </div>
          </div>

          <div class="fifa-section league-section">
            <div class="section-label">League</div>
            <div class="section-content">
              <button class="arrow-btn" type="button" data-panel="league" data-dir="-1">◀</button>
              <div class="value-box">
                <div class="league-text" id="leagueValue">Polish Premier League</div>
              </div>
              <button class="arrow-btn" type="button" data-panel="league" data-dir="1">▶</button>
            </div>
          </div>
        </div>

        <div class="selection-actions">
          <button class="select-button" id="selectClubBtn" type="button">SELECT</button>
        </div>

        <div class="post-select-menu hidden" id="postSelectMenu">
          <div class="post-select-grid">
            <button class="post-select-choice is-active" type="button" data-post-index="0">
              <span class="post-select-choice-main">button1</span>
              <span class="post-select-option-controls">
                <span class="post-select-option-arrow" data-option-direction="-1">◀</span>
                <span class="post-select-choice-sub">sub</span>
                <span class="post-select-option-arrow" data-option-direction="1">▶</span>
              </span>
            </button>
            <button class="post-select-choice" type="button" data-post-index="1">
              <span class="post-select-choice-main">button2</span>
              <span class="post-select-option-controls">
                <span class="post-select-option-arrow" data-option-direction="-1">◀</span>
                <span class="post-select-choice-sub">sub</span>
                <span class="post-select-option-arrow" data-option-direction="1">▶</span>
              </span>
            </button>
            <button class="post-select-choice" type="button" data-post-index="2">
              <span class="post-select-choice-main">button3</span>
              <span class="post-select-option-controls">
                <span class="post-select-option-arrow" data-option-direction="-1">◀</span>
                <span class="post-select-choice-sub">sub</span>
                <span class="post-select-option-arrow" data-option-direction="1">▶</span>
              </span>
            </button>
            <button class="post-select-choice" type="button" data-post-index="3">
              <span class="post-select-choice-main">button4</span>
              <span class="post-select-option-controls">
                <span class="post-select-option-arrow" data-option-direction="-1">◀</span>
                <span class="post-select-choice-sub">sub</span>
                <span class="post-select-option-arrow" data-option-direction="1">▶</span>
              </span>
            </button>
            <button class="post-select-choice" type="button" data-post-index="4">
              <span class="post-select-choice-main">button5</span>
              <span class="post-select-option-controls">
                <span class="post-select-option-arrow" data-option-direction="-1">◀</span>
                <span class="post-select-choice-sub">sub</span>
                <span class="post-select-option-arrow" data-option-direction="1">▶</span>
              </span>
            </button>
            <button class="post-select-choice select-choice" type="button" data-post-index="5">
              <span class="post-select-choice-main">Select</span>
            </button>
          </div>
        </div>

        <div class="save-name-screen hidden" id="saveNameScreen">
          <h2 class="save-name-title">Save</h2>
          <div class="save-name-content">
            <div class="save-list">
              <h3 class="save-list-heading">Career saves</h3>
              <button class="save-slot is-active" type="button">1&nbsp;&nbsp; New career</button>
              <button class="save-slot" type="button">2&nbsp;&nbsp; Empty slot</button>
              <button class="save-slot" type="button">3&nbsp;&nbsp; Empty slot</button>
            </div>
            <div class="save-name-editor">
              <h3 class="save-list-heading">Save name</h3>
              <input class="save-name-input" id="saveNameInput" type="text" maxlength="24" value="New career" autocomplete="off" />
              <div class="screen-keyboard" id="screenKeyboard">
                <button class="screen-key" type="button" data-key="1">1</button>
                <button class="screen-key" type="button" data-key="2">2</button>
                <button class="screen-key" type="button" data-key="3">3</button>
                <button class="screen-key" type="button" data-key="4">4</button>
                <button class="screen-key" type="button" data-key="5">5</button>
                <button class="screen-key" type="button" data-key="6">6</button>
                <button class="screen-key" type="button" data-key="7">7</button>
                <button class="screen-key" type="button" data-key="8">8</button>
                <button class="screen-key" type="button" data-key="9">9</button>
                <button class="screen-key" type="button" data-key="0">0</button>
                <button class="screen-key" type="button" data-key="Q">Q</button>

      <div class="button-row" id="startButtons">
        <div class="main-menu">
          <button class="career-launcher is-active" id="startSaveBtn" type="button">
            <span class="career-image-slot">IMAGE SLOT</span>
            <span class="main-button-title">NEW CAREER</span>
          </button>

          <div class="menu-side" aria-label="extra menu panels">
            <button class="menu-panel" type="button" data-menu-index="1">
              <span class="menu-panel-content">
                <span class="menu-thumb">IMAGE SLOT</span>
                <span class="menu-panel-label">button1</span>
              </span>
            </button>
            <button class="menu-panel" type="button" data-menu-index="2">
              <span class="menu-panel-content">
                <span class="menu-thumb">IMAGE SLOT</span>
                <span class="menu-panel-label">button2</span>
              </span>
            </button>
            <button class="menu-panel" type="button" data-menu-index="3">
              <span class="menu-panel-content">
                <span class="menu-thumb">IMAGE SLOT</span>
                <span class="menu-panel-label">button3</span>
              </span>
            </button>
          </div>

      <div class="save-status hidden" id="saveStatus">Waiting to start...</div>
    </div>

    <script src="data/countries.js"></script>
    <script src="data/leagues.js"></script>
    <script src="data/clubs.js"></script>
    <script src="data/players.js"></script>

    <script>
      let gameState = {
        year: 2027,
        month: 7,
        day: 1,
        hour: 12,
        started: false,
        clubId: null,
        saveName: 'save_game_1'
      };

      const saveStatus = document.getElementById('saveStatus');
      const startSaveBtn = document.getElementById('startSaveBtn');
      const topDate = document.getElementById('topDate');
      const dateDay = document.getElementById('dateDay');
      const dateTime = document.getElementById('dateTime');
      const countryValue = document.getElementById('countryValue');
      const clubName = document.getElementById('clubName');
      const clubLogo = document.getElementById('clubLogo');
      const clubStars = document.getElementById('clubStars');
      const statAtt = document.getElementById('statAtt');
      const statMid = document.getElementById('statMid');
      const statDef = document.getElementById('statDef');
      const leagueValue = document.getElementById('leagueValue');
      const selectClubBtn = document.getElementById('selectClubBtn');
      const startButtons = document.getElementById('startButtons');
      const gameScreen = document.getElementById('gameScreen');
      const postSelectMenu = document.getElementById('postSelectMenu');
      const postSelectChoices = Array.from(document.querySelectorAll('.post-select-choice'));
      const saveNameScreen = document.getElementById('saveNameScreen');
      const saveNameInput = document.getElementById('saveNameInput');
      const saveNameConfirm = document.getElementById('saveNameConfirm');
      const saveLibraryKey = 'football_manager_save_library';
      const virtualKeyboardKeys = Array.from(document.querySelectorAll('.screen-key'));
      const virtualKeyboardControls = [...virtualKeyboardKeys];
      const mainMenuButtons = [
        document.getElementById('startSaveBtn'),
        ...document.querySelectorAll('.menu-panel')
      ];

      let mainMenuSelectionIndex = 0;
      let postSelectionIndex = 0;
      let savedCareers = [];
      let virtualKeyboardIndex = 0;
      let capsLockEnabled = false;

      let clubSelectionState = {
        countryIndex: 0,
        leagueIndex: 0,
        clubIndex: 0,
        activePanel: 'country'
      };

      function updateMainMenuSelection() {
        mainMenuButtons.forEach((button, index) => {
          const isActive = index === mainMenuSelectionIndex;
          button.classList.toggle('is-active', isActive);
        });
      }

      function updatePostSelectionVisual() {
        postSelectChoices.forEach((button, index) => {
          button.classList.toggle('is-active', index === postSelectionIndex);
        });
      }

      function activatePostSelection() {
        const selectedButton = postSelectChoices[postSelectionIndex];
        if (!selectedButton) return;

        if (selectedButton.classList.contains('select-choice')) {
          postSelectMenu.classList.add('hidden');
          showSaveNameScreen();
        }
      }

      function showSaveNameScreen() {
        gameScreen.classList.add('post-menu-active');
        topDate.classList.add('hidden');
        saveNameScreen.classList.remove('hidden');
        saveNameInput.value = '';
        virtualKeyboardIndex = 0;
        updateVirtualKeyboardVisual();
      }

      function updateVirtualKeyboardVisual() {
        virtualKeyboardControls.forEach((control, index) => {
          control.classList.toggle('is-active', index === virtualKeyboardIndex);
        });
        updateVirtualKeyboardLetters();
      }

      function updateVirtualKeyboardLetters() {
        virtualKeyboardKeys.forEach((keyButton) => {
          const key = keyButton.dataset.key;
          if (!/^[A-Z]$/.test(key)) return;
          keyButton.textContent = capsLockEnabled ? key : key.toLowerCase();
        });

        const capsButton = virtualKeyboardKeys.find((keyButton) => keyButton.dataset.key === 'SHIFT');
        if (capsButton) {
          capsButton.textContent = capsLockEnabled ? 'CAPS ON' : 'CAPS';
          capsButton.classList.toggle('caps-lock-active', capsLockEnabled);
        }
      }

      function activateVirtualKeyboardControl() {
        const control = virtualKeyboardControls[virtualKeyboardIndex];
        if (!control) return;

        if (control === saveNameConfirm) {
          confirmSaveName();
          return;
        }

        pressScreenKey(control.dataset.key);
      }

      function moveVirtualKeyboard(direction) {
        const current = virtualKeyboardControls[virtualKeyboardIndex];
        if (!current) return;

        const currentRect = current.getBoundingClientRect();
        const currentX = currentRect.left + currentRect.width / 2;
        const currentY = currentRect.top + currentRect.height / 2;
        const isHorizontal = direction === 'left' || direction === 'right';
        const candidates = virtualKeyboardControls
          .map((control, index) => ({ control, index, rect: control.getBoundingClientRect() }))
          .filter(({ index, rect }) => {
            if (index === virtualKeyboardIndex) return false;
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const isActionControl = index >= virtualKeyboardKeys.length;
            if (isHorizontal && Math.abs(centerY - currentY) > currentRect.height * 1.5) return false;
            if (!isHorizontal && Math.abs(centerX - currentX) > currentRect.width * 1.8 && !(direction === 'down' && !isActionControl)) return false;
            if (direction === 'left') return centerX < currentX;
            if (direction === 'right') return centerX > currentX;
            if (direction === 'up') return centerY < currentY;
            return centerY > currentY;
          })
          .sort(({ rect: first }, { rect: second }) => {
            const firstX = first.left + first.width / 2;
            const firstY = first.top + first.height / 2;
            const secondX = second.left + second.width / 2;
            const secondY = second.top + second.height / 2;
            return Math.hypot(firstX - currentX, firstY - currentY) - Math.hypot(secondX - currentX, secondY - currentY);
          });

        if (candidates[0]) {
          virtualKeyboardIndex = candidates[0].index;
          updateVirtualKeyboardVisual();
        }
      }

      function returnToMainMenu() {
        saveNameScreen.classList.add('hidden');
        postSelectMenu.classList.add('hidden');
        gameScreen.classList.add('hidden');
        gameScreen.classList.remove('post-menu-active');
        startButtons.classList.remove('hidden');
        topDate.classList.add('hidden');
        saveStatus.classList.add('hidden');
        updateMainMenuSelection();
      }

      function loadSavedCareers() {
        try {
          savedCareers = JSON.parse(localStorage.getItem(saveLibraryKey) || '[]');
        } catch (error) {
          savedCareers = [];
        }

        if (!savedCareers.length) {
          const legacySave = localStorage.getItem('save_game_1');
          if (legacySave) {
            try {
              savedCareers = [{ name: 'save_game_1', save: JSON.parse(legacySave) }];
              localStorage.setItem(saveLibraryKey, JSON.stringify(savedCareers));
            } catch (error) {
              savedCareers = [];
            }
          }
        }
      }

      function persistSave(save, displayName) {
        savedCareers = savedCareers.filter((entry) => entry.name !== displayName);
        savedCareers.unshift({ name: displayName, save });
        localStorage.setItem(saveLibraryKey, JSON.stringify(savedCareers));
        renderSavedCareers();
      }

      function renderSavedCareers() {
        const slots = Array.from(document.querySelectorAll('.save-slot'));
        slots.forEach((slot, index) => {
          const save = savedCareers[index];
          slot.textContent = save ? `${index + 1}  ${save.name}` : `${index + 1}  Empty slot`;
          slot.classList.toggle('is-active', index === 0);
        });
      }

      function confirmSaveName() {
        const name = saveNameInput.value.trim() || 'New career';
        gameState.saveName = name.replace(/[^a-zA-Z0-9_-]/g, '_');
        const save = createSave();
        persistSave(save, name);
        saveStatus.textContent = `Saved: ${name}`;
        saveStatus.classList.remove('hidden');
        saveNameScreen.classList.add('hidden');
        gameScreen.classList.remove('post-menu-active');
      }

      function pressScreenKey(key) {
        if (key === 'BACKSPACE') {
          saveNameInput.value = saveNameInput.value.slice(0, -1);
        } else if (key === 'ENTER') {
          confirmSaveName();
        } else if (key === 'SHIFT') {
          capsLockEnabled = !capsLockEnabled;
          updateVirtualKeyboardVisual();
        } else if (key === 'CTRL' || key === 'ALT') {
          return;
        } else if (saveNameInput.value.length < saveNameInput.maxLength) {
          saveNameInput.value += /^[A-Z]$/.test(key) && !capsLockEnabled ? key.toLowerCase() : key;
        }
      }

      const postSelectionOptions = [
        ['Option 1A', 'Option 1B', 'Option 1C'],
        ['Option 2A', 'Option 2B', 'Option 2C'],
        ['Option 3A', 'Option 3B', 'Option 3C'],
        ['Option 4A', 'Option 4B', 'Option 4C'],
        ['Option 5A', 'Option 5B', 'Option 5C']
      ];

      const postSelectionOptionIndexes = [0, 0, 0, 0, 0];

      function updatePostSelectionOption() {
        postSelectChoices.forEach((button, buttonIndex) => {
          const options = postSelectionOptions[buttonIndex];
          const optionIndex = postSelectionOptionIndexes[buttonIndex];
          const optionLabel = button.querySelector('.post-select-choice-sub');

          if (options && optionLabel) {
            optionLabel.textContent = options[optionIndex];
          }
        });
      }

      function movePostSelectionOption(direction) {
        const options = postSelectionOptions[postSelectionIndex];
        if (!options) return;

        const currentIndex = postSelectionOptionIndexes[postSelectionIndex];
        postSelectionOptionIndexes[postSelectionIndex] =
          (currentIndex + direction + options.length) % options.length;
        updatePostSelectionOption();
      }

      function moveMainMenuSelection(direction) {
        if (direction < 0) {
          mainMenuSelectionIndex = 0;
          updateMainMenuSelection();
          return;
        }

        if (mainMenuSelectionIndex === 0) {
          mainMenuSelectionIndex = 1;
          updateMainMenuSelection();
        }
      }

      function activateMainMenuSelection() {
        const selectedButton = mainMenuButtons[mainMenuSelectionIndex];
        if (!selectedButton) return;

        if (selectedButton.id === 'startSaveBtn') {
          startSaveProcedure();
          return;
        }

        selectedButton.click();
      }

      function updateDateHeader() {
        dateDay.textContent = String(gameState.day);
        dateTime.textContent = `${String(gameState.hour).padStart(2, '0')}:00`;
      }

      function getDatabase() {
        return window.gameDatabase || {
          countries: [],
          leagues: [],
          clubs: [],
          players: []
        };
      }

      function getCountryOptions() {
        return getDatabase().countries || [];
      }

      function getLeagueOptionsForCountry(countryId) {
        return (getDatabase().leagues || []).filter((league) => league.countryId === countryId);
      }

      function getClubOptionsForCountryAndLeague(countryId, leagueId) {
        return (getDatabase().clubs || []).filter((club) => {
          if (club.countryId !== countryId) return false;
          if (leagueId) return club.leagueId === leagueId;
          return true;
        });
      }

      function getClubStars(club) {
        const prestige = club.prestige || 50;
        return Math.ceil(prestige / 20);
      }

      function getClubStats(club) {
        const prestige = club.prestige || 50;
        const reputation = club.reputation || 50;
        const transferPower = club.transferPower || 50;

        const att = Math.min(99, Math.round((reputation + transferPower) / 2 + (prestige - 50) * 0.3));
        const mid = Math.min(99, Math.round((prestige + reputation) / 2));
        const def = Math.min(99, Math.round((prestige + transferPower) / 2 - (prestige - 50) * 0.2));

        return {
          att: Math.max(30, att),
          mid: Math.max(30, mid),
          def: Math.max(30, def)
        };
      }

      function renderClubInfo(club) {
        clubName.textContent = club.name;

        const hasLogo = Boolean(club.logoUrl && club.logoUrl.trim());
        if (hasLogo) {
          clubLogo.style.display = 'flex';
          clubLogo.innerHTML = `<img src="${club.logoUrl}" alt="${club.name} crest" />`;
        } else {
          clubLogo.style.display = 'none';
          clubLogo.innerHTML = '';
        }

        const stars = getClubStars(club);
        const starsHtml = Array.from({ length: 5 }, (_, i) => 
          `<span class="star">${i < stars ? '★' : '☆'}</span>`
        ).join('');
        clubStars.innerHTML = starsHtml;

        const stats = getClubStats(club);
        statAtt.textContent = stats.att;
        statMid.textContent = stats.mid;
        statDef.textContent = stats.def;
      }

      function updateActiveSelectionVisual() {
        const activePanel = clubSelectionState.activePanel;

        const countrySection = document.querySelector('.country-section');
        const clubSection = document.querySelector('.club-section');
        const leagueSection = document.querySelector('.league-section');

        countrySection.style.background = activePanel === 'country' ? '#b777d6' : '#1d1f22';
        clubSection.style.background = activePanel === 'club' ? '#b777d6' : '#1d1f22';
        leagueSection.style.background = activePanel === 'league' ? '#b777d6' : '#2f3034';

        if (activePanel === 'select') {
          selectClubBtn.style.background = 'linear-gradient(135deg, #b777d6, #9e62c9)';
          selectClubBtn.style.color = '#ffffff';
          selectClubBtn.style.boxShadow = 'inset 0 0 0 2px rgba(255,255,255,0.18)';
        } else {
          selectClubBtn.style.background = 'linear-gradient(135deg, #1d1f22, #2f3034)';
          selectClubBtn.style.color = '#f4f4f6';
          selectClubBtn.style.boxShadow = 'none';
        }
      }

      function refreshSelectionState() {
        const countries = getCountryOptions();
        if (!countries.length) return;

        const country = countries[clubSelectionState.countryIndex] || countries[0];
        const leagues = getLeagueOptionsForCountry(country.id);
        if (!leagues.length) {
          clubSelectionState.leagueIndex = 0;
        } else {
          if (clubSelectionState.leagueIndex >= leagues.length) {
            clubSelectionState.leagueIndex = 0;
          }
        }

        const league = leagues[clubSelectionState.leagueIndex] || leagues[0];
        const clubs = getClubOptionsForCountryAndLeague(country.id, league ? league.id : null);
        if (!clubs.length) {
          clubSelectionState.clubIndex = 0;
        } else {
          if (clubSelectionState.clubIndex >= clubs.length) {
            clubSelectionState.clubIndex = 0;
          }
        }

        const club = clubs[clubSelectionState.clubIndex] || clubs[0];

        countryValue.textContent = country.name;
        leagueValue.textContent = league ? league.name : 'No league';
        if (club) renderClubInfo(club);
      }

      function moveSelection(panel, direction) {
        const countries = getCountryOptions();
        const currentCountry = countries[clubSelectionState.countryIndex] || countries[0];
        const leagues = getLeagueOptionsForCountry(currentCountry.id);
        const currentLeague = leagues[clubSelectionState.leagueIndex] || leagues[0];
        const clubs = getClubOptionsForCountryAndLeague(currentCountry.id, currentLeague ? currentLeague.id : null);

        if (panel === 'country') {
          if (countries.length <= 1) return;
          clubSelectionState.countryIndex = (clubSelectionState.countryIndex + direction + countries.length) % countries.length;
          clubSelectionState.leagueIndex = 0;
          clubSelectionState.clubIndex = 0;
        }

        if (panel === 'league') {
          if (!leagues.length || leagues.length <= 1) return;
          clubSelectionState.leagueIndex = (clubSelectionState.leagueIndex + direction + leagues.length) % leagues.length;
          clubSelectionState.clubIndex = 0;
        }

        if (panel === 'club') {
          if (!clubs.length) return;
          clubSelectionState.clubIndex = (clubSelectionState.clubIndex + direction + clubs.length) % clubs.length;
        }

        refreshSelectionState();
      }

      function refreshArrowButtonState() {
        const countries = getCountryOptions();
        const country = countries[clubSelectionState.countryIndex] || countries[0];
        const leagues = getLeagueOptionsForCountry(country ? country.id : null);

        document.querySelectorAll('.arrow-btn').forEach((button) => {
          const panel = button.dataset.panel;
          const isDisabled = (panel === 'country' && countries.length <= 1) || (panel === 'league' && leagues.length <= 1);
          button.disabled = isDisabled;
          button.style.opacity = isDisabled ? '0.35' : '1';
          button.style.pointerEvents = isDisabled ? 'none' : 'auto';
        });
      }

      function selectCurrentClub() {
        const countries = getCountryOptions();
        const country = countries[clubSelectionState.countryIndex] || countries[0];
        const leagues = getLeagueOptionsForCountry(country.id);
        const league = leagues[clubSelectionState.leagueIndex] || leagues[0];
        const clubs = getClubOptionsForCountryAndLeague(country.id, league ? league.id : null);
        const club = clubs[clubSelectionState.clubIndex] || clubs[0];

        if (!club) return;

        gameState.clubId = club.id;
        topDate.classList.remove('hidden');
        saveStatus.textContent = `Selected club: ${club.name} | save in progress...`;
        const save = createSave();
        console.log('Save created:', save);

        gameScreen.classList.remove('hidden');
        startButtons.classList.add('hidden');
        saveStatus.classList.add('hidden');
        showPostSelectionMenu();
      }

      function createSave() {
        const db = getDatabase();
        const save = {
          meta: {
            saveName: gameState.saveName,
            startedAt: new Date(Date.UTC(gameState.year, gameState.month - 1, gameState.day, gameState.hour)).toISOString(),
            version: '0.1.0'
          },
          date: {
            year: gameState.year,
            month: gameState.month,
            day: gameState.day,
            hour: gameState.hour
          },
          selectedClubId: gameState.clubId,
          database: {
            countries: db.countries,
            leagues: db.leagues,
            clubs: db.clubs,
            players: db.players
          }
        };

        localStorage.setItem(gameState.saveName, JSON.stringify(save));
        return save;
      }

      function activateSelectionScreen() {
        gameScreen.classList.remove('hidden');
        gameScreen.classList.remove('post-menu-active');
        startButtons.classList.remove('hidden');
        saveStatus.classList.add('hidden');
        postSelectMenu.classList.add('hidden');
        saveNameScreen.classList.add('hidden');
        refreshSelectionState();
      }

      function showPostSelectionMenu() {
        const panel = document.querySelector('.fifa-panel');
        const actions = document.querySelector('.selection-actions');
        if (panel) panel.classList.add('hidden');
        if (actions) actions.classList.add('hidden');
        gameScreen.classList.add('post-menu-active');
        postSelectMenu.classList.remove('hidden');
        postSelectionIndex = 0;
        updatePostSelectionVisual();
        updatePostSelectionOption();
      }

      function startSaveProcedure() {
        gameState.started = true;
        topDate.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        startButtons.classList.add('hidden');
        saveStatus.classList.add('hidden');
        refreshSelectionState();
        updateDateHeader();
      }

      document.querySelectorAll('.arrow-btn').forEach((button) => {
        button.addEventListener('click', () => {
          if (button.disabled) return;
          const panel = button.dataset.panel;
          const direction = Number(button.dataset.dir || 1);
          clubSelectionState.activePanel = panel;
          moveSelection(panel, direction);
          updateActiveSelectionVisual();
        });
      });

      selectClubBtn.addEventListener('click', () => {
        clubSelectionState.activePanel = 'select';
        updateActiveSelectionVisual();
        selectCurrentClub();
      });

      selectClubBtn.addEventListener('focus', () => {
        clubSelectionState.activePanel = 'select';
        updateActiveSelectionVisual();
      });

      postSelectChoices.forEach((button, index) => {
        button.addEventListener('click', () => {
          postSelectionIndex = index;
          updatePostSelectionVisual();
          activatePostSelection();
        });
      });

      document.querySelectorAll('.screen-key').forEach((button) => {
        button.addEventListener('click', () => {
          virtualKeyboardIndex = virtualKeyboardControls.indexOf(button);
          updateVirtualKeyboardVisual();
          pressScreenKey(button.dataset.key);
        });
      });

      saveNameConfirm.addEventListener('click', () => {
        virtualKeyboardIndex = virtualKeyboardControls.indexOf(saveNameConfirm);
        updateVirtualKeyboardVisual();
        confirmSaveName();
      });

      document.querySelectorAll('.post-select-option-arrow').forEach((arrow) => {
        arrow.addEventListener('click', (event) => {
          event.stopPropagation();
          const choice = arrow.closest('.post-select-choice');
          if (!choice) return;

          postSelectionIndex = Number(choice.dataset.postIndex);
          updatePostSelectionVisual();
          movePostSelectionOption(Number(arrow.dataset.optionDirection));
        });
      });

      startSaveBtn.addEventListener('click', startSaveProcedure);

      mainMenuButtons.forEach((button, index) => {
        button.addEventListener('click', () => {
          mainMenuSelectionIndex = index;
          updateMainMenuSelection();
          if (button.id === 'startSaveBtn') {
            startSaveProcedure();
          }
        });
      });

      document.addEventListener('keydown', (event) => {
        if (!saveNameScreen.classList.contains('hidden')) {
          if (event.key === 'ArrowLeft' || event.key === 'ArrowRight' || event.key === 'ArrowUp' || event.key === 'ArrowDown') {
            event.preventDefault();
            moveVirtualKeyboard(event.key.slice(5).toLowerCase());
            return;
          }

          if (event.key === 'Enter') {
            event.preventDefault();
            activateVirtualKeyboardControl();
            return;
          }

          if (event.key === 'Escape') {
            event.preventDefault();
            returnToMainMenu();
            return;
          }

          if (event.key === 'Backspace') {
            event.preventDefault();
            pressScreenKey('BACKSPACE');
            return;
          }

          if (event.key === 'CapsLock') {
            event.preventDefault();
            pressScreenKey('SHIFT');
            return;
          }

          if (event.key.length === 1 && !event.ctrlKey && !event.altKey && !event.metaKey) {
            event.preventDefault();
            const key = /^[a-zA-Z]$/.test(event.key)
              ? (capsLockEnabled ? event.key.toUpperCase() : event.key.toLowerCase())
              : event.key;
            pressScreenKey(key);
          }

          return;
        }

        if (!postSelectMenu.classList.contains('hidden')) {
          if (event.key === '[') {
            event.preventDefault();
            movePostSelectionOption(-1);
            return;
          }

          if (event.key === ']') {
            event.preventDefault();
            movePostSelectionOption(1);
            return;
          }

          const currentRow = Math.floor(postSelectionIndex / 3);
          const currentColumn = postSelectionIndex % 3;

          if (event.key === 'ArrowLeft' && currentColumn > 0) {
            event.preventDefault();
            postSelectionIndex -= 1;
            updatePostSelectionVisual();
            return;
          }

          if (event.key === 'ArrowRight' && currentColumn < 2) {
            event.preventDefault();
            postSelectionIndex += 1;
            updatePostSelectionVisual();
            return;
          }

          if (event.key === 'ArrowUp' && currentRow > 0) {
            event.preventDefault();
            postSelectionIndex -= 3;
            updatePostSelectionVisual();
            return;
          }

          if (event.key === 'ArrowDown' && currentRow < 1) {
            event.preventDefault();
            postSelectionIndex += 3;
            updatePostSelectionVisual();
            return;
          }

          if (event.key === 'Enter') {
            event.preventDefault();
            activatePostSelection();
            return;
          }
        }

        if (startButtons && !startButtons.classList.contains('hidden')) {
          if (event.key === 'ArrowLeft') {
            event.preventDefault();
            moveMainMenuSelection(-1);
            return;
          }

          if (event.key === 'ArrowRight') {
            event.preventDefault();
            if (mainMenuSelectionIndex === 0) {
              mainMenuSelectionIndex = 1;
              updateMainMenuSelection();
            }
            return;
          }

          if (event.key === 'ArrowUp') {
            event.preventDefault();
            if (mainMenuSelectionIndex > 0) {
              mainMenuSelectionIndex = Math.max(0, mainMenuSelectionIndex - 1);
              updateMainMenuSelection();
            }
            return;
          }

          if (event.key === 'ArrowDown') {
            event.preventDefault();
            if (mainMenuSelectionIndex >= 0 && mainMenuSelectionIndex < mainMenuButtons.length - 1) {
              mainMenuSelectionIndex = Math.min(mainMenuButtons.length - 1, mainMenuSelectionIndex + 1);
              updateMainMenuSelection();
            }
            return;
          }

          if (event.key === 'Enter') {
            event.preventDefault();
            activateMainMenuSelection();
            return;
          }
        }

        if (!gameScreen.classList.contains('hidden')) {
          if (event.key === 'ArrowLeft') {
            if (clubSelectionState.activePanel === 'select') {
              return;
            }
            const currentCountry = getCountryOptions()[clubSelectionState.countryIndex] || getCountryOptions()[0];
            const currentLeagueOptions = getLeagueOptionsForCountry(currentCountry ? currentCountry.id : null);
            if (clubSelectionState.activePanel === 'league' && currentLeagueOptions.length <= 1) {
              return;
            }
            if (clubSelectionState.activePanel === 'country' && getCountryOptions().length <= 1) {
              return;
            }
            event.preventDefault();
            moveSelection(clubSelectionState.activePanel, -1);
            updateActiveSelectionVisual();
            return;
          }

          if (event.key === 'ArrowRight') {
            if (clubSelectionState.activePanel === 'select') {
              return;
            }
            const currentCountry = getCountryOptions()[clubSelectionState.countryIndex] || getCountryOptions()[0];
            const currentLeagueOptions = getLeagueOptionsForCountry(currentCountry ? currentCountry.id : null);
            if (clubSelectionState.activePanel === 'league' && currentLeagueOptions.length <= 1) {
              return;
            }
            if (clubSelectionState.activePanel === 'country' && getCountryOptions().length <= 1) {
              return;
            }
            event.preventDefault();
            moveSelection(clubSelectionState.activePanel, 1);
            updateActiveSelectionVisual();
            return;
          }

          if (event.key === 'ArrowUp') {
            const order = ['country', 'club', 'league', 'select'];
            const index = order.indexOf(clubSelectionState.activePanel);
            clubSelectionState.activePanel = order[(index - 1 + order.length) % order.length];
            updateActiveSelectionVisual();
          }

          if (event.key === 'ArrowDown') {
            const order = ['country', 'club', 'league', 'select'];
            const index = order.indexOf(clubSelectionState.activePanel);
            clubSelectionState.activePanel = order[(index + 1) % order.length];
            updateActiveSelectionVisual();
          }

          if (event.key === 'Enter') {
            event.preventDefault();
            selectCurrentClub();
          }
        }
      });

      updateDateHeader();
      topDate.classList.add('hidden');
      loadSavedCareers();
      renderSavedCareers();
      refreshSelectionState();
      refreshArrowButtonState();
      updateActiveSelectionVisual();
      updateMainMenuSelection();
      updatePostSelectionVisual();

      document.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });

      document.addEventListener('selectstart', function (event) {
        event.preventDefault();
      });

      document.addEventListener('dragstart', function (event) {
        event.preventDefault();
      });
    </script>
  </body>
</html>
