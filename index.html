<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Manager</title>
    <style>
      :root {
        --panel: rgba(9, 17, 28, 0.86);
        --panel-border: rgba(255,255,255,0.12);
        --accent: #2dd4bf;
        --accent-2: #facc15;
        --text: #ecfdf5;
        --muted: #bfd3d1;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      body {
        position: relative;
        background-image: url('background.jpg');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-attachment: fixed;
        color: var(--text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-user-drag: none;
      }

      html, body, * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      *::-webkit-scrollbar {
        display: none;
      }

      .app {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .top-date {
        position: absolute;
        top: 16px;
        left: 18px;
        z-index: 2;
        display: flex;
        align-items: baseline;
        gap: 8px;
        color: #f4f4f4;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        background: transparent;
        border: none;
        outline: none;
        box-shadow: none;
      }

      .top-date .day-number {
        font-size: clamp(2rem, 3vw, 3.2rem);
        line-height: 1;
      }

      .top-date .time {
        font-size: clamp(0.7rem, 1vw, 1rem);
        opacity: 0.92;
        line-height: 1;
      }

      .screen {
        width: min(900px, 84vw);
        background: rgba(7, 12, 18, 0.72);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 26px 22px 18px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }

      .selection-title {
        text-align: center;
        font-size: clamp(1.6rem, 2.2vw, 2.2rem);
        font-weight: 700;
        margin-bottom: 22px;
        letter-spacing: 0.04em;
      }

      .selection-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .selector-arrow {
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 10px;
        background: rgba(255,255,255,0.08);
        color: var(--text);
        font-size: 1.8rem;
        cursor: pointer;
        line-height: 1;
      }

      .selector-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 84px;
        width: min(520px, 62vw);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        text-align: center;
        padding: 12px 18px;
      }

      .selector-box.country-box {
        min-height: 78px;
      }

      .selector-box.club-box {
        min-height: 128px;
        width: min(360px, 40vw);
      }

      .selector-box.league-box {
        min-height: 78px;
      }

      .selector-label {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .selector-value {
        font-size: clamp(1rem, 1.6vw, 1.5rem);
        font-weight: 700;
        line-height: 1.2;
      }

      .selection-actions {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      .select-button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #14b8a6);
        color: #062b2a;
        cursor: pointer;
        padding: 12px 22px;
        font-weight: 800;
        min-width: 160px;
      }

      .button-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        width: 100%;
        margin: 0 auto 20px;
      }

      button {
        appearance: none;
        border: none;
        cursor: pointer;
        border-radius: 12px;
        padding: 12px 18px;
        min-width: 180px;
        font-size: 1rem;
        font-weight: 700;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), #14b8a6);
        color: #062b2a;
      }

      .secondary {
        background: rgba(255,255,255,0.08);
        color: var(--text);
        border: 1px solid var(--panel-border);
      }

      .save-status {
        text-align: center;
        color: var(--accent-2);
        min-height: 24px;
        font-weight: 600;
        margin-bottom: 18px;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top-date" id="topDate">
        <span class="day-number" id="dateDay">1</span>
        <span class="time" id="dateTime">12:00</span>
      </div>

      <div class="screen hidden" id="gameScreen">
        <div class="selection-title">Select club</div>

        <div class="selection-row">
          <button class="selector-arrow" type="button" data-panel="country" data-dir="-1">◀</button>
          <div class="selector-box country-box" data-panel="country">
            <div class="selector-label">Country</div>
            <div class="selector-value" id="countryValue">Poland</div>
          </div>
          <button class="selector-arrow" type="button" data-panel="country" data-dir="1">▶</button>
        </div>

        <div class="selection-row">
          <button class="selector-arrow" type="button" data-panel="club" data-dir="-1">◀</button>
          <div class="selector-box club-box" data-panel="club">
            <div class="selector-label">Club</div>
            <div class="selector-value" id="clubValue">Legia Warsaw</div>
          </div>
          <button class="selector-arrow" type="button" data-panel="club" data-dir="1">▶</button>
        </div>

        <div class="selection-row">
          <button class="selector-arrow" type="button" data-panel="league" data-dir="-1">◀</button>
          <div class="selector-box league-box" data-panel="league">
            <div class="selector-label">League</div>
            <div class="selector-value" id="leagueValue">Polish Premier League</div>
          </div>
          <button class="selector-arrow" type="button" data-panel="league" data-dir="1">▶</button>
        </div>

        <div class="selection-actions">
          <button class="select-button" id="selectClubBtn" type="button">Select</button>
        </div>
      </div>

      <div class="button-row" id="startButtons">
        <button class="primary" id="startSaveBtn">Start save</button>
        <button class="secondary" id="resetBtn">Reset data</button>
      </div>

      <div class="save-status hidden" id="saveStatus">Waiting to start...</div>
    </div>

    <script src="data/countries.js"></script>
    <script src="data/leagues.js"></script>
    <script src="data/clubs.js"></script>
    <script src="data/players.js"></script>

    <script>
      let gameState = {
        year: 2027,
        month: 7,
        day: 1,
        hour: 12,
        started: false,
        clubId: null,
        saveName: 'save_game_1'
      };

      const saveStatus = document.getElementById('saveStatus');
      const startSaveBtn = document.getElementById('startSaveBtn');
      const resetBtn = document.getElementById('resetBtn');
      const dateDay = document.getElementById('dateDay');
      const dateTime = document.getElementById('dateTime');
      const countryValue = document.getElementById('countryValue');
      const clubValue = document.getElementById('clubValue');
      const leagueValue = document.getElementById('leagueValue');
      const selectClubBtn = document.getElementById('selectClubBtn');
      const startButtons = document.getElementById('startButtons');
      const gameScreen = document.getElementById('gameScreen');

      let clubSelectionState = {
        countryIndex: 0,
        leagueIndex: 0,
        clubIndex: 0,
        activePanel: 'country'
      };

      function updateDateHeader() {
        dateDay.textContent = String(gameState.day);
        dateTime.textContent = `${String(gameState.hour).padStart(2, '0')}:00`;
      }

      function getDatabase() {
        return window.gameDatabase || {
          countries: [],
          leagues: [],
          clubs: [],
          players: []
        };
      }

      function getCountryOptions() {
        return getDatabase().countries || [];
      }

      function getLeagueOptionsForCountry(countryId) {
        return (getDatabase().leagues || []).filter((league) => league.countryId === countryId);
      }

      function getClubOptionsForCountryAndLeague(countryId, leagueId) {
        return (getDatabase().clubs || []).filter((club) => {
          if (club.countryId !== countryId) return false;
          if (leagueId) return club.leagueId === leagueId;
          return true;
        });
      }

      function refreshSelectionState() {
        const countries = getCountryOptions();
        if (!countries.length) return;

        const country = countries[clubSelectionState.countryIndex] || countries[0];
        const leagues = getLeagueOptionsForCountry(country.id);
        if (!leagues.length) {
          clubSelectionState.leagueIndex = 0;
        } else {
          if (clubSelectionState.leagueIndex >= leagues.length) {
            clubSelectionState.leagueIndex = 0;
          }
        }

        const league = leagues[clubSelectionState.leagueIndex] || leagues[0];
        const clubs = getClubOptionsForCountryAndLeague(country.id, league ? league.id : null);
        if (!clubs.length) {
          clubSelectionState.clubIndex = 0;
        } else {
          if (clubSelectionState.clubIndex >= clubs.length) {
            clubSelectionState.clubIndex = 0;
          }
        }

        const club = clubs[clubSelectionState.clubIndex] || clubs[0];

        countryValue.textContent = country.name;
        leagueValue.textContent = league ? league.name : 'No league';
        clubValue.textContent = club ? club.name : 'No club';
      }

      function moveSelection(panel, direction) {
        const countries = getCountryOptions();
        const currentCountry = countries[clubSelectionState.countryIndex] || countries[0];
        const leagues = getLeagueOptionsForCountry(currentCountry.id);
        const currentLeague = leagues[clubSelectionState.leagueIndex] || leagues[0];
        const clubs = getClubOptionsForCountryAndLeague(currentCountry.id, currentLeague ? currentLeague.id : null);

        if (panel === 'country') {
          clubSelectionState.countryIndex = (clubSelectionState.countryIndex + direction + countries.length) % countries.length;
          clubSelectionState.leagueIndex = 0;
          clubSelectionState.clubIndex = 0;
        }

        if (panel === 'league') {
          if (!leagues.length) return;
          clubSelectionState.leagueIndex = (clubSelectionState.leagueIndex + direction + leagues.length) % leagues.length;
          clubSelectionState.clubIndex = 0;
        }

        if (panel === 'club') {
          if (!clubs.length) return;
          clubSelectionState.clubIndex = (clubSelectionState.clubIndex + direction + clubs.length) % clubs.length;
        }

        refreshSelectionState();
      }

      function selectCurrentClub() {
        const countries = getCountryOptions();
        const country = countries[clubSelectionState.countryIndex] || countries[0];
        const leagues = getLeagueOptionsForCountry(country.id);
        const league = leagues[clubSelectionState.leagueIndex] || leagues[0];
        const clubs = getClubOptionsForCountryAndLeague(country.id, league ? league.id : null);
        const club = clubs[clubSelectionState.clubIndex] || clubs[0];

        if (!club) return;

        gameState.clubId = club.id;
        saveStatus.textContent = `Selected club: ${club.name} | save in progress...`;
        const save = createSave();
        console.log('Save created:', save);

        gameScreen.classList.add('hidden');
        startButtons.classList.add('hidden');
        saveStatus.classList.remove('hidden');
      }

      function createSave() {
        const db = getDatabase();
        const save = {
          meta: {
            saveName: gameState.saveName,
            startedAt: new Date(Date.UTC(gameState.year, gameState.month - 1, gameState.day, gameState.hour)).toISOString(),
            version: '0.1.0'
          },
          date: {
            year: gameState.year,
            month: gameState.month,
            day: gameState.day,
            hour: gameState.hour
          },
          selectedClubId: gameState.clubId,
          database: {
            countries: db.countries,
            leagues: db.leagues,
            clubs: db.clubs,
            players: db.players
          }
        };

        localStorage.setItem(gameState.saveName, JSON.stringify(save));
        return save;
      }

      function activateSelectionScreen() {
        gameScreen.classList.remove('hidden');
        startButtons.classList.remove('hidden');
        saveStatus.classList.add('hidden');
        refreshSelectionState();
      }

      function startSaveProcedure() {
        gameState.started = true;
        gameScreen.classList.remove('hidden');
        startButtons.classList.add('hidden');
        saveStatus.classList.add('hidden');
        refreshSelectionState();
        updateDateHeader();
      }

      function resetGameData() {
        localStorage.removeItem(gameState.saveName);
        gameState.clubId = null;
        gameState.started = false;
        saveStatus.textContent = 'Data reset. Waiting to start...';
        saveStatus.classList.remove('hidden');
        gameScreen.classList.add('hidden');
        startButtons.classList.remove('hidden');
        refreshSelectionState();
      }

      document.querySelectorAll('.selector-arrow').forEach((button) => {
        button.addEventListener('click', () => {
          const panel = button.dataset.panel;
          const direction = Number(button.dataset.dir || 1);
          moveSelection(panel, direction);
        });
      });

      selectClubBtn.addEventListener('click', selectCurrentClub);
      startSaveBtn.addEventListener('click', startSaveProcedure);
      resetBtn.addEventListener('click', resetGameData);

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          moveSelection(clubSelectionState.activePanel, -1);
        }

        if (event.key === 'ArrowRight') {
          event.preventDefault();
          moveSelection(clubSelectionState.activePanel, 1);
        }

        if (event.key === 'ArrowUp') {
          const order = ['country', 'club', 'league'];
          const index = order.indexOf(clubSelectionState.activePanel);
          clubSelectionState.activePanel = order[(index - 1 + order.length) % order.length];
          document.querySelectorAll('.selector-box').forEach((box) => {
            box.style.borderColor = box.dataset.panel === clubSelectionState.activePanel ? 'rgba(45,212,191,0.9)' : 'rgba(255,255,255,0.14)';
          });
        }

        if (event.key === 'ArrowDown') {
          const order = ['country', 'club', 'league'];
          const index = order.indexOf(clubSelectionState.activePanel);
          clubSelectionState.activePanel = order[(index + 1) % order.length];
          document.querySelectorAll('.selector-box').forEach((box) => {
            box.style.borderColor = box.dataset.panel === clubSelectionState.activePanel ? 'rgba(45,212,191,0.9)' : 'rgba(255,255,255,0.14)';
          });
        }

        if (event.key === 'Enter') {
          event.preventDefault();
          selectCurrentClub();
        }
      });

      document.querySelectorAll('.selector-box').forEach((box) => {
        box.addEventListener('click', () => {
          clubSelectionState.activePanel = box.dataset.panel;
          document.querySelectorAll('.selector-box').forEach((item) => {
            item.style.borderColor = item.dataset.panel === clubSelectionState.activePanel ? 'rgba(45,212,191,0.9)' : 'rgba(255,255,255,0.14)';
          });
        });
      });

      updateDateHeader();
      refreshSelectionState();
      document.querySelectorAll('.selector-box').forEach((box) => {
        box.style.borderColor = box.dataset.panel === clubSelectionState.activePanel ? 'rgba(45,212,191,0.9)' : 'rgba(255,255,255,0.14)';
      });

      document.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });

      document.addEventListener('selectstart', function (event) {
        event.preventDefault();
      });

      document.addEventListener('dragstart', function (event) {
        event.preventDefault();
      });
    </script>
  </body>
</html>
